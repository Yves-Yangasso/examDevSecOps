name: CD

# Le déploiement n'est déclenché que par une CI verte sur main.
# Aucun chemin ne permet de déployer un artefact qui n'a pas traversé la chaîne
# complète de tests et de scans.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag d'image à déployer (SHA long)"
        required: true

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: bao236/examdevsecops
  # Plage 1808x : les ports 8080/8081 sont déjà utilisés par d'autres projets
  # sur la machine hôte. Un runner self-hosted partage la machine avec le reste
  # de son environnement — un déploiement ne doit jamais entrer en collision.
  STAGING_PORT: '18081'
  CANARY_PORT: '18082'
  PRODUCTION_PORT: '18080'

jobs:
  # ---------------------------------------------------------------------------
  # Garde d'admission. Tourne sur le runner LOCAL : on vérifie la signature sur
  # la machine même qui exécutera l'image, et on résout le tag en DIGEST.
  # Déployer ensuite par digest ferme la fenêtre entre « ce qui a été vérifié »
  # et « ce qui est démarré » — un tag peut être réécrit entre les deux.
  # ---------------------------------------------------------------------------
  verify-artifact:
    name: Vérification de la signature
    # GARDE-FOU CRITIQUE — le dépôt est public et le runner tourne sur une
    # machine personnelle. Un runner self-hosted exposé à des PR de forks
    # permettrait à n'importe qui d'exécuter du code arbitraire sur cette
    # machine. Trois verrous cumulés :
    #   1. Ce workflow n'écoute PAS `pull_request`, seulement `workflow_run`
    #      sur main (branche protégée) et `workflow_dispatch` (droit d'écriture).
    #   2. La condition ci-dessous refuse tout déclenchement dont le dépôt
    #      source n'est pas ce dépôt — donc tout fork.
    #   3. L'environnement `production` exige une validation humaine.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, shopflow-local]
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      # On expose le DIGEST NU (`sha256:...`) et non la référence complète.
      # `IMAGE_NAME` commence par le nom d'utilisateur Docker Hub, qui est un
      # secret : le runner refuse de transmettre une sortie de job contenant une
      # valeur masquée (« Skip output 'image' since it may contain secret ») et
      # la remplace silencieusement par une chaîne vide. Les jobs consommateurs
      # reconstruisent `$REGISTRY/$IMAGE_NAME@$DIGEST` depuis `env`.
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      # Le runner tourne en service launchd, sans session graphique ouverte :
      # le trousseau macOS refuse tout accès non interactif ("User interaction
      # is not allowed", -25308). Or le CLI Docker Desktop bascule sur le
      # credential helper — donc sur le trousseau — dès que sa configuration ne
      # contient AUCUNE authentification, ce qui fait échouer `docker login`
      # comme un simple `docker pull`. On écrit donc l'authentification
      # directement dans une configuration Docker propre au job : le CLI utilise
      # alors son magasin fichier, et les identifiants meurent avec le job.
      - name: Configuration Docker du job (registre, hors trousseau macOS)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Le point de terminaison du démon est résolu AVANT de basculer sur la
          # configuration isolée : `currentContext` (ici `desktop-linux`) vit dans
          # ~/.docker/config.json. Une configuration neuve ne le contient pas, le
          # CLI retombe donc sur le contexte `default` — unix:///var/run/docker.sock,
          # socket que Docker Desktop ne crée que si l'option « default Docker
          # socket » est active. D'où le « Cannot connect to the Docker daemon ».
          # On fige explicitement DOCKER_HOST : l'isolation des identifiants ne
          # doit pas emporter avec elle l'adresse du démon.
          DOCKER_ENDPOINT="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2> /dev/null || true)"
          if [ -z "$DOCKER_ENDPOINT" ]; then
            for SOCK in "$HOME/.docker/run/docker.sock" /var/run/docker.sock; do
              if [ -S "$SOCK" ]; then DOCKER_ENDPOINT="unix://$SOCK"; break; fi
            done
          fi
          [ -n "$DOCKER_ENDPOINT" ] || { echo "::error::Démon Docker introuvable sur le runner."; exit 1; }
          echo "DOCKER_HOST=$DOCKER_ENDPOINT" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
          umask 077
          # `docker compose` est un PLUGIN CLI, cherché dans
          # $DOCKER_CONFIG/cli-plugins avant les emplacements système. Une
          # configuration neuve ne voit donc plus ~/.docker/cli-plugins et
          # `docker compose` disparaît (« unknown command »). `cliPluginsExtraDirs`
          # rend les plugins de la machine visibles sans réintroduire le trousseau.
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}},"cliPluginsExtraDirs":["%s"]}\n' \
            "$AUTH" "$HOME/.docker/cli-plugins" > "$RUNNER_TEMP/docker/config.json"

          # Échouer ici, avec un message clair, plutôt que trois étapes plus loin
          # sur un `docker pull` dont l'erreur ne dit pas d'où vient le problème.
          DOCKER_CONFIG="$RUNNER_TEMP/docker" DOCKER_HOST="$DOCKER_ENDPOINT" \
            docker version --format '{{.Server.Version}}' > /dev/null \
            || { echo "::error::Démon Docker injoignable sur $DOCKER_ENDPOINT."; exit 1; }
          DOCKER_CONFIG="$RUNNER_TEMP/docker" DOCKER_HOST="$DOCKER_ENDPOINT" \
            docker compose version > /dev/null \
            || { echo "::error::Plugin docker compose introuvable depuis la configuration du job."; exit 1; }
          echo "Démon Docker joignable : $DOCKER_ENDPOINT"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Résolution du tag puis du digest
        id: resolve
        # Les valeurs issues du contexte passent par `env:` et jamais par une
        # interpolation directe dans le script : `${{ }}` est substitué AVANT
        # l'exécution du shell, ce qui permettrait une injection de commande
        # via un nom de branche ou une saisie d'utilisateur.
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="${INPUT_TAG:-$RUN_SHA}"
          REF="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          docker pull --quiet "$REF"
          # `RepoDigests` liste TOUS les dépôts connus pour ces couches : sur le
          # runner qui a aussi servi aux builds locaux, l'index 0 peut être un
          # nom local (`shopflow@sha256:...`), sans registre — le déploiement
          # tirerait alors une image introuvable. On sélectionne explicitement
          # l'entrée de NOTRE dépôt et on n'en garde que le digest.
          DIGEST="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REF" \
            | grep "^${IMAGE_NAME}@" | head -n1 | cut -d@ -f2)"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::Digest introuvable pour ${IMAGE_NAME} (tag $TAG)."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image résolue : ${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Vérification Cosign (identité OIDC du workflow de build)
        env:
          DIGEST: ${{ steps.resolve.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/ci.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  # ---------------------------------------------------------------------------
  # Staging — déploiement automatique sur le Docker local, port 8081.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Déploiement staging
    needs: verify-artifact
    runs-on: [self-hosted, shopflow-local]
    timeout-minutes: 20
    environment:
      name: staging
      url: http://localhost:18081
    steps:
      # Le runner tourne en service launchd, sans session graphique ouverte :
      # le trousseau macOS refuse tout accès non interactif ("User interaction
      # is not allowed", -25308). Or le CLI Docker Desktop bascule sur le
      # credential helper — donc sur le trousseau — dès que sa configuration ne
      # contient AUCUNE authentification, ce qui fait échouer `docker login`
      # comme un simple `docker pull`. On écrit donc l'authentification
      # directement dans une configuration Docker propre au job : le CLI utilise
      # alors son magasin fichier, et les identifiants meurent avec le job.
      - name: Configuration Docker du job (registre, hors trousseau macOS)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Le point de terminaison du démon est résolu AVANT de basculer sur la
          # configuration isolée : `currentContext` (ici `desktop-linux`) vit dans
          # ~/.docker/config.json. Une configuration neuve ne le contient pas, le
          # CLI retombe donc sur le contexte `default` — unix:///var/run/docker.sock,
          # socket que Docker Desktop ne crée que si l'option « default Docker
          # socket » est active. D'où le « Cannot connect to the Docker daemon ».
          # On fige explicitement DOCKER_HOST : l'isolation des identifiants ne
          # doit pas emporter avec elle l'adresse du démon.
          DOCKER_ENDPOINT="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2> /dev/null || true)"
          if [ -z "$DOCKER_ENDPOINT" ]; then
            for SOCK in "$HOME/.docker/run/docker.sock" /var/run/docker.sock; do
              if [ -S "$SOCK" ]; then DOCKER_ENDPOINT="unix://$SOCK"; break; fi
            done
          fi
          [ -n "$DOCKER_ENDPOINT" ] || { echo "::error::Démon Docker introuvable sur le runner."; exit 1; }
          echo "DOCKER_HOST=$DOCKER_ENDPOINT" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
          umask 077
          # `docker compose` est un PLUGIN CLI, cherché dans
          # $DOCKER_CONFIG/cli-plugins avant les emplacements système. Une
          # configuration neuve ne voit donc plus ~/.docker/cli-plugins et
          # `docker compose` disparaît (« unknown command »). `cliPluginsExtraDirs`
          # rend les plugins de la machine visibles sans réintroduire le trousseau.
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}},"cliPluginsExtraDirs":["%s"]}\n' \
            "$AUTH" "$HOME/.docker/cli-plugins" > "$RUNNER_TEMP/docker/config.json"

          # Échouer ici, avec un message clair, plutôt que trois étapes plus loin
          # sur un `docker pull` dont l'erreur ne dit pas d'où vient le problème.
          DOCKER_CONFIG="$RUNNER_TEMP/docker" DOCKER_HOST="$DOCKER_ENDPOINT" \
            docker version --format '{{.Server.Version}}' > /dev/null \
            || { echo "::error::Démon Docker injoignable sur $DOCKER_ENDPOINT."; exit 1; }
          DOCKER_CONFIG="$RUNNER_TEMP/docker" DOCKER_HOST="$DOCKER_ENDPOINT" \
            docker compose version > /dev/null \
            || { echo "::error::Plugin docker compose introuvable depuis la configuration du job."; exit 1; }
          echo "Démon Docker joignable : $DOCKER_ENDPOINT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Déploiement
        env:
          DIGEST: ${{ needs.verify-artifact.outputs.digest }}
          VERSION: ${{ needs.verify-artifact.outputs.tag }}
          APP_OTEL_EXPORTER_URL: http://127.0.0.1:4318/v1/traces
        run: |
          ./scripts/deploy-local.sh staging \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" "$STAGING_PORT" "$VERSION"

      - name: Tests de fumée
        run: |
          curl -sf "http://127.0.0.1:${STAGING_PORT}/healthz" > /dev/null
          curl -sf "http://127.0.0.1:${STAGING_PORT}/" | grep -q '<div id="root">'
          # Les en-têtes de sécurité sont revérifiés sur l'instance déployée :
          # c'est exactement le défaut qui avait échappé au développement.
          HEADERS="$(curl -sI "http://127.0.0.1:${STAGING_PORT}/")"
          for H in content-security-policy x-frame-options x-content-type-options referrer-policy; do
            echo "$HEADERS" | grep -qi "^$H:" || { echo "::error::En-tête $H absent."; exit 1; }
          done
          echo "Staging opérationnel avec ses en-têtes de sécurité."

      - name: Retour arrière si le smoke échoue
        if: failure()
        run: ./scripts/rollback-local.sh staging "$STAGING_PORT"

  # ---------------------------------------------------------------------------
  # Production — canari sur 8082, mesuré, puis promotion sur 8080.
  # La protection d'environnement GitHub impose une validation humaine.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Déploiement production
    needs: [verify-artifact, deploy-staging]
    runs-on: [self-hosted, shopflow-local]
    timeout-minutes: 30
    environment:
      # Cet environnement porte la règle "required reviewers" côté GitHub :
      # le job reste en attente tant qu'un approbateur n'a pas validé.
      # Le contrôle du déploiement est une décision humaine tracée.
      name: production
      url: http://localhost:18080
    steps:
      # Le runner tourne en service launchd, sans session graphique ouverte :
      # le trousseau macOS refuse tout accès non interactif ("User interaction
      # is not allowed", -25308). Or le CLI Docker Desktop bascule sur le
      # credential helper — donc sur le trousseau — dès que sa configuration ne
      # contient AUCUNE authentification, ce qui fait échouer `docker login`
      # comme un simple `docker pull`. On écrit donc l'authentification
      # directement dans une configuration Docker propre au job : le CLI utilise
      # alors son magasin fichier, et les identifiants meurent avec le job.
      - name: Configuration Docker du job (registre, hors trousseau macOS)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Le point de terminaison du démon est résolu AVANT de basculer sur la
          # configuration isolée : `currentContext` (ici `desktop-linux`) vit dans
          # ~/.docker/config.json. Une configuration neuve ne le contient pas, le
          # CLI retombe donc sur le contexte `default` — unix:///var/run/docker.sock,
          # socket que Docker Desktop ne crée que si l'option « default Docker
          # socket » est active. D'où le « Cannot connect to the Docker daemon ».
          # On fige explicitement DOCKER_HOST : l'isolation des identifiants ne
          # doit pas emporter avec elle l'adresse du démon.
          DOCKER_ENDPOINT="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2> /dev/null || true)"
          if [ -z "$DOCKER_ENDPOINT" ]; then
            for SOCK in "$HOME/.docker/run/docker.sock" /var/run/docker.sock; do
              if [ -S "$SOCK" ]; then DOCKER_ENDPOINT="unix://$SOCK"; break; fi
            done
          fi
          [ -n "$DOCKER_ENDPOINT" ] || { echo "::error::Démon Docker introuvable sur le runner."; exit 1; }
          echo "DOCKER_HOST=$DOCKER_ENDPOINT" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
          umask 077
          # `docker compose` est un PLUGIN CLI, cherché dans
          # $DOCKER_CONFIG/cli-plugins avant les emplacements système. Une
          # configuration neuve ne voit donc plus ~/.docker/cli-plugins et
          # `docker compose` disparaît (« unknown command »). `cliPluginsExtraDirs`
          # rend les plugins de la machine visibles sans réintroduire le trousseau.
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}},"cliPluginsExtraDirs":["%s"]}\n' \
            "$AUTH" "$HOME/.docker/cli-plugins" > "$RUNNER_TEMP/docker/config.json"

          # Échouer ici, avec un message clair, plutôt que trois étapes plus loin
          # sur un `docker pull` dont l'erreur ne dit pas d'où vient le problème.
          DOCKER_CONFIG="$RUNNER_TEMP/docker" DOCKER_HOST="$DOCKER_ENDPOINT" \
            docker version --format '{{.Server.Version}}' > /dev/null \
            || { echo "::error::Démon Docker injoignable sur $DOCKER_ENDPOINT."; exit 1; }
          DOCKER_CONFIG="$RUNNER_TEMP/docker" DOCKER_HOST="$DOCKER_ENDPOINT" \
            docker compose version > /dev/null \
            || { echo "::error::Plugin docker compose introuvable depuis la configuration du job."; exit 1; }
          echo "Démon Docker joignable : $DOCKER_ENDPOINT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Démarrage du canari
        env:
          DIGEST: ${{ needs.verify-artifact.outputs.digest }}
          VERSION: ${{ needs.verify-artifact.outputs.tag }}
          APP_OTEL_EXPORTER_URL: http://127.0.0.1:4318/v1/traces
        run: |
          ./scripts/deploy-local.sh canary \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" "$CANARY_PORT" "$VERSION"

      - name: Observation du canari
        run: ./scripts/canary-check.sh "http://127.0.0.1:${CANARY_PORT}" 0.02 60

      - name: Promotion à 100 %
        env:
          DIGEST: ${{ needs.verify-artifact.outputs.digest }}
          VERSION: ${{ needs.verify-artifact.outputs.tag }}
          APP_OTEL_EXPORTER_URL: http://127.0.0.1:4318/v1/traces
        run: |
          ./scripts/deploy-local.sh production \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" "$PRODUCTION_PORT" "$VERSION"

      - name: Arrêt du canari
        if: always()
        # `down` interpole le fichier compose exactement comme `up` : sans les
        # variables requises il s'arrête sur « SHOPFLOW_IMAGE est requis », et le
        # `|| true` d'origine avalait cet échec — le canari survivait donc à
        # chaque déploiement, port 18082 occupé jusqu'au prochain redémarrage.
        # SHOPFLOW_IMAGE n'est pas utilisée par `down` : elle doit seulement être
        # définie pour que l'interpolation aboutisse.
        run: |
          SHOPFLOW_IMAGE=inutilisee-pour-down APP_ENVIRONMENT=canary HOST_PORT="$CANARY_PORT" \
            docker compose -p shopflow-canary -f deploy/compose/docker-compose.deploy.yml down \
            || echo "::warning::Arrêt du canari incomplet — vérifier le port ${CANARY_PORT}."

      - name: Retour arrière automatique en cas d'échec
        if: failure()
        run: ./scripts/rollback-local.sh production "$PRODUCTION_PORT"

      - name: Marqueur de déploiement pour Grafana
        if: always()
        # Sans marqueur, personne ne relie un pic d'erreurs à un déploiement.
        # C'est la question la plus utile en incident : "qu'est-ce qui a changé ?"
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          TAG: ${{ needs.verify-artifact.outputs.tag }}
          STATUS: ${{ job.status }}
        run: |
          [ -n "${GRAFANA_URL:-}" ] || { echo "Grafana non configuré — marqueur ignoré."; exit 0; }
          BODY="$(python3 -c 'import json,os; print(json.dumps({"tags":["deploy","production"],"text":"Deploiement %s - statut %s" % (os.environ["TAG"], os.environ["STATUS"])}))')"
          curl -sf -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$BODY" > /dev/null || echo "::warning::Marqueur Grafana non posé."
