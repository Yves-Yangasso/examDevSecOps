apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Corrélation logs -> traces : un clic depuis une ligne de log ouvre la
      # trace correspondante. C'est ce lien qui fait passer de "j'ai des données"
      # à "je diagnostique en 2 minutes".
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"[0-9a-f]{2}-([0-9a-f]{32})-'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
      serviceMap:
        datasourceUid: prometheus
