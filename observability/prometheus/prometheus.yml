global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: shopflow-local
    env: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Métriques nginx (connexions, requêtes) via l'exporteur officiel.
  - job_name: shopflow-frontend
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: shopflow-frontend

  # Sonde boîte noire : mesure la disponibilité vue de l'extérieur, seule
  # métrique qui corresponde vraiment à l'expérience utilisateur.
  - job_name: shopflow-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://frontend:8080/healthz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
