sonar.projectKey=shopflow-frontend
sonar.projectName=ShopFlow Frontend
sonar.organization=shopflow

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=src/**/*.d.ts,src/main.tsx
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.coverage.exclusions=tests/**,src/observability/**,src/main.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality gate appliquée au CODE NOUVEAU uniquement.
#
# Pourquoi : imposer 80 % de couverture sur une base existante conduit à des
# tests écrits pour la métrique. La règle "clean as you code" fait converger la
# qualité sans bloquer l'équipe, et elle est tenable dans la durée.
sonar.qualitygate.wait=true
sonar.newCode.referenceBranch=main
