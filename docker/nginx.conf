worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Masque la version de nginx dans la bannière et les pages d'erreur.
  # Une version exacte publiée, c'est un scan de CVE offert à l'attaquant.
  server_tokens off;

  # Logs JSON : consommés tels quels par Promtail -> Loki, sans regex fragile.
  log_format json_combined escape=json
    '{'
      '"ts":"$time_iso8601",'
      '"level":"info",'
      '"service":"shopflow-frontend",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"path":"$uri",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"request_time":$request_time,'
      '"trace_id":"$http_traceparent"'
    '}';

  access_log /dev/stdout json_combined;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;

  # Limites anti-abus élémentaires.
  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Chemins temporaires en /tmp : le conteneur peut tourner avec un système de
  # fichiers racine en lecture seule (readOnlyRootFilesystem: true en K8s).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include /etc/nginx/conf.d/*.conf;
}
