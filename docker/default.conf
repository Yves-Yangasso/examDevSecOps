server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  limit_req zone=general burst=60 nodelay;

  # Refus des méthodes inutiles à un frontend statique.
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
  }

  include /etc/nginx/security-headers.conf;

  # Sonde de vivacité — jamais journalisée pour ne pas noyer les logs utiles.
  location = /healthz {
    include /etc/nginx/security-headers.conf;
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Métriques nginx scrapées par nginx-prometheus-exporter (réseau interne seul).
  location = /nginx_status {
    stub_status on;
    access_log off;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
  }

  # Config runtime générée au démarrage dans /tmp (racine en lecture seule).
  # Jamais mise en cache : sinon une promotion d'environnement laisserait des
  # navigateurs sur l'ancienne configuration.
  location = /config.js {
    include /etc/nginx/security-headers.conf;
    alias /tmp/shopflow/config.js;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Content-Type "application/javascript" always;
  }

  # Assets fingerprintés par Vite (nom contenant un hash) : immuables, cache long.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Aucun fichier caché ni sourcemap servi en production.
  location ~ /\. {
    deny all;
  }
  location ~ \.map$ {
    deny all;
  }

  # Fallback SPA. `index.html` ne doit jamais être caché : c'est lui qui
  # référence la nouvelle version des assets après un déploiement.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
