# En-têtes de sécurité — inclus dans CHAQUE bloc location.
#
# Piège nginx : `add_header` n'est pas cumulatif entre niveaux. Dès qu'une
# location déclare son propre add_header, elle perd TOUS ceux hérités du bloc
# server. Un simple `Cache-Control` dans une location suffit donc à faire
# disparaître silencieusement la CSP. D'où ce fichier inclus explicitement
# partout, et le test E2E qui vérifie les en-têtes sur la réponse réelle.
#
# La CSP est la défense en profondeur la plus rentable d'une SPA : même si un
# XSS est introduit, le navigateur refuse d'exécuter un script inline ou de
# contacter un domaine non listé, ce qui bloque l'exfiltration.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://fakestoreapi.com; font-src 'self'; connect-src 'self' https://fakestoreapi.com http://otel-collector:4318; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS : actif seulement derrière une terminaison TLS. Inoffensif en HTTP.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
